<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://alcdn.msauth.net/browser/3.18.0/js/msal-browser.min.js"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2129;
    --surface-alt: #212932;
    --line: #313B46;
    --text: #EDEFF2;
    --muted: #8B95A1;
    --muted-dim: #5C6672;
    --red: #E4483C;
    --red-dim: #402224;
    --amber: #DFA53F;
    --amber-dim: #3E3421;
    --green: #4FAE7A;
    --green-dim: #1F3229;
    --focus: #6FA8DC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .display{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .wrap{max-width:980px;margin:0 auto;}

  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--line);
    padding-bottom:18px;
    margin-bottom:24px;
    gap:16px;
    flex-wrap:wrap;
  }
  .masthead h1{ font-size:34px; margin:0; line-height:1; }
  .masthead .sub{
    color:var(--muted); font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; margin-top:6px;
  }

  .controls{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px;
    margin-bottom:24px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;
    align-items:end;
  }
  @media (max-width:560px){ .controls{grid-template-columns:1fr;} }

  .field label{
    display:block; font-family:'Barlow Condensed', sans-serif; font-size:12px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
    margin-bottom:6px; font-weight:600;
  }
  .field input[type=email]{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:3px; font-family:'IBM Plex Mono', monospace; font-size:13px;
  }
  .field input:focus{outline:2px solid var(--focus); outline-offset:1px;}

  button.primary{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; background:var(--focus); color:#0E141B; border:none;
    padding:11px 22px; border-radius:3px; cursor:pointer; font-size:15px; white-space:nowrap;
  }
  button.primary:disabled{background:var(--line); color:var(--muted-dim); cursor:not-allowed;}
  button.primary:hover:not(:disabled){filter:brightness(1.08);}

  .status-msg{ font-size:12px; color:var(--muted); margin:-8px 0 20px 2px; min-height:16px; }
  .status-msg.err{color:var(--red);}
  .status-msg.ok{color:var(--green);}

  .summary{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:24px;
  }
  @media (max-width:680px){ .summary{grid-template-columns:1fr;} }
  .chip{
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:4px; padding:14px 16px; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease; user-select:none;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip .num{font-family:'Barlow Condensed'; font-weight:800; font-size:30px; line-height:1;}
  .chip .lbl{font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-top:6px;}
  .chip.red{border-left-color:var(--red);} .chip.red .num{color:var(--red);}
  .chip.amber{border-left-color:var(--amber);} .chip.amber .num{color:var(--amber);}
  .chip.green{border-left-color:var(--green);} .chip.green .num{color:var(--green);}
  .chip.active{outline:2px solid var(--focus); outline-offset:2px;}
  .chip.dimmed{opacity:0.4;}

  .order{
    background:var(--surface); border:1px solid var(--line); border-radius:4px;
    margin-bottom:12px; overflow:hidden; position:relative;
  }
  .order::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:5px; }
  .order.red::before{background:var(--red);}
  .order.amber::before{background:var(--amber);}
  .order.green::before{background:var(--green);}

  .order-head{
    padding:14px 18px 14px 24px; display:flex; align-items:center; justify-content:space-between;
    gap:14px; cursor:pointer; flex-wrap:wrap;
  }
  .order-head:hover{background:var(--surface-alt);}
  .order-main{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .order-num{font-family:'Barlow Condensed'; font-weight:700; font-size:20px;}
  .order-cliente{font-size:13px; color:var(--text);}
  .order-meta{font-size:11px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap;}
  .order-meta span b{color:var(--text); font-weight:600;}

  .stamp{
    font-family:'Barlow Condensed'; font-weight:700; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; padding:5px 10px; border-radius:3px; border:1.5px solid; white-space:nowrap;
  }
  .stamp.red{color:var(--red); border-color:var(--red); background:var(--red-dim);}
  .stamp.amber{color:var(--amber); border-color:var(--amber); background:var(--amber-dim);}
  .stamp.green{color:var(--green); border-color:var(--green); background:var(--green-dim);}

  .caret{color:var(--muted); font-size:12px; transition:transform .15s ease;}
  .order.open .caret{transform:rotate(90deg);}

  .lines-wrap{ max-height:0; overflow:hidden; transition:max-height .2s ease; border-top:1px solid transparent; }
  .order.open .lines-wrap{ max-height:2000px; border-top:1px solid var(--line); }
  table.lines{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.lines th{
    text-align:left; font-family:'Barlow Condensed'; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--muted); font-size:10.5px; padding:8px 18px; background:var(--surface-alt);
  }
  table.lines td{ padding:8px 18px; border-top:1px solid var(--line); color:var(--text); }
  table.lines td.num, table.lines th.num{text-align:right;}
  table.lines tr td.disp-ok{color:var(--green);}
  table.lines tr td.disp-bad{color:var(--red);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
    border:1px dashed var(--line); border-radius:4px;
  }
  .empty-state .display{font-size:20px; color:var(--text); margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1 class="display">Panel de Pedidos</h1>
      <div class="sub">Clasificación por stock y fecha de disponibilidad</div>
    </div>
  </div>

  <div class="controls" id="loginControls">
    <div class="field">
      <label>Sesión</label>
      <div id="userInfo" style="font-size:13px; color:var(--muted);">No has iniciado sesión.</div>
    </div>
    <button class="primary" id="loginBtn">Iniciar sesión con Microsoft</button>
  </div>
  <div class="status-msg" id="statusMsg"></div>

  <div id="summaryWrap" style="display:none;">
    <div class="summary">
      <div class="chip red" data-filter="sin_stock_sin_fecha" id="chipRed">
        <div class="num">0</div>
        <div class="lbl">Sin stock · sin fecha</div>
      </div>
      <div class="chip amber" data-filter="sin_stock_con_fecha" id="chipAmber">
        <div class="num">0</div>
        <div class="lbl">Sin stock · con fecha</div>
      </div>
      <div class="chip green" data-filter="con_stock" id="chipGreen">
        <div class="num">0</div>
        <div class="lbl">Con stock</div>
      </div>
    </div>
  </div>

  <div id="ordersContainer"></div>

</div>

<script>
// ---- Configuración de Entra ID ----
// El Client ID y Tenant ID NO son secretos, es seguro tenerlos aquí en el frontend.
const msalConfig = {
  auth: {
    clientId: 'PEGA_AQUI_TU_CLIENT_ID',
    authority: 'https://login.microsoftonline.com/PEGA_AQUI_TU_TENANT_ID',
    redirectUri: window.location.origin
  },
  cache: {
    cacheLocation: 'sessionStorage'
  }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);
let currentIdToken = null;

const loginBtn = document.getElementById('loginBtn');
const userInfo = document.getElementById('userInfo');
const statusMsg = document.getElementById('statusMsg');
const summaryWrap = document.getElementById('summaryWrap');
const ordersContainer = document.getElementById('ordersContainer');
const chipRed = document.getElementById('chipRed');
const chipAmber = document.getElementById('chipAmber');
const chipGreen = document.getElementById('chipGreen');

let currentOrders = [];
let activeFilter = null;

function fmtDate(v){
  if(!v) return '—';
  const d = (v instanceof Date) ? v : new Date(v);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function initMsal(){
  await msalInstance.initialize();
  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){
    await acquireTokenAndLoad(accounts[0]);
  }
}

loginBtn.addEventListener('click', async () => {
  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){
    // Ya logueado -> cerrar sesión
    await msalInstance.logoutPopup();
    currentIdToken = null;
    userInfo.textContent = 'No has iniciado sesión.';
    loginBtn.textContent = 'Iniciar sesión con Microsoft';
    summaryWrap.style.display = 'none';
    ordersContainer.innerHTML = '';
    statusMsg.textContent = '';
    return;
  }

  try {
    const result = await msalInstance.loginPopup({ scopes: ['User.Read'] });
    await acquireTokenAndLoad(result.account);
  } catch (err){
    statusMsg.textContent = 'Error al iniciar sesión: ' + err.message;
    statusMsg.className = 'status-msg err';
  }
});

async function acquireTokenAndLoad(account){
  msalInstance.setActiveAccount(account);
  const tokenResp = await msalInstance.acquireTokenSilent({
    scopes: ['User.Read'],
    account
  }).catch(() => msalInstance.acquireTokenPopup({ scopes: ['User.Read'] }));

  currentIdToken = tokenResp.idToken;
  userInfo.textContent = account.username;
  loginBtn.textContent = 'Cerrar sesión';
  await loadPedidos();
}

async function loadPedidos(){
  statusMsg.textContent = 'Consultando pedidos...';
  statusMsg.className = 'status-msg';

  try {
    const resp = await fetch('/api/pedidos', {
      headers: { Authorization: 'Bearer ' + currentIdToken }
    });
    const data = await resp.json();

    if(!resp.ok){
      throw new Error(data.error || 'Error desconocido');
    }

    currentOrders = data.orders || [];
    activeFilter = null;

    if(!currentOrders.length){
      statusMsg.textContent = 'No se han encontrado pedidos para tu usuario.';
      statusMsg.className = 'status-msg';
      summaryWrap.style.display = 'none';
      ordersContainer.innerHTML = '<div class="empty-state"><div class="display">Sin pedidos</div>No hay líneas para tu email.</div>';
      return;
    }

    statusMsg.textContent = currentOrders.length + ' pedido(s) encontrados.';
    statusMsg.className = 'status-msg ok';
    renderSummary(currentOrders);
    renderOrders(currentOrders);
  } catch(err){
    statusMsg.textContent = 'Error: ' + err.message;
    statusMsg.className = 'status-msg err';
    summaryWrap.style.display = 'none';
    ordersContainer.innerHTML = '';
  }
}

function renderSummary(orders){
  const counts = { sin_stock_sin_fecha:0, sin_stock_con_fecha:0, con_stock:0 };
  orders.forEach(o => counts[o.clasificacion]++);
  chipRed.querySelector('.num').textContent = counts.sin_stock_sin_fecha;
  chipAmber.querySelector('.num').textContent = counts.sin_stock_con_fecha;
  chipGreen.querySelector('.num').textContent = counts.con_stock;
  summaryWrap.style.display = 'block';
  updateChipStates();
}

function updateChipStates(){
  [chipRed, chipAmber, chipGreen].forEach(chip => {
    const f = chip.dataset.filter;
    chip.classList.toggle('active', activeFilter === f);
    chip.classList.toggle('dimmed', activeFilter !== null && activeFilter !== f);
  });
}

[chipRed, chipAmber, chipGreen].forEach(chip => {
  chip.addEventListener('click', () => {
    const f = chip.dataset.filter;
    activeFilter = (activeFilter === f) ? null : f;
    updateChipStates();
    renderOrders(currentOrders);
  });
});

const CLASS_META = {
  sin_stock_sin_fecha: { color:'red', label:'Sin stock · Sin fecha' },
  sin_stock_con_fecha: { color:'amber', label:'Sin stock · Con fecha' },
  con_stock: { color:'green', label:'Con stock' }
};

function renderOrders(orders){
  const visible = activeFilter ? orders.filter(o => o.clasificacion === activeFilter) : orders;

  if(!visible.length){
    ordersContainer.innerHTML = '<div class="empty-state"><div class="display">Nada que mostrar</div>No hay pedidos en esta categoría.</div>';
    return;
  }

  ordersContainer.innerHTML = visible.map((o, idx) => {
    const meta = CLASS_META[o.clasificacion];
    const linesHtml = o.lines.map(l => `
      <tr>
        <td>${escapeHtml(l.articulo)}</td>
        <td class="num">${l.cantidad}</td>
        <td class="num">${l.existencia}</td>
        <td class="num ${l.disponible > 0 ? 'disp-ok' : 'disp-bad'}">${l.disponible}</td>
        <td>${fmtDate(l.fechaDisponible)}</td>
      </tr>
    `).join('');

    return `
      <div class="order ${meta.color}" data-idx="${idx}">
        <div class="order-head" onclick="toggleOrder(this)">
          <div class="order-main">
            <span class="caret">▶</span>
            <span class="order-num">#${escapeHtml(o.numdoc)}</span>
            <span class="order-cliente">${escapeHtml(o.cliente || 'Sin cliente')}</span>
          </div>
          <div class="order-main">
            <span class="order-meta">
              <span>Carga: <b>${fmtDate(o.fechaPedido)}</b></span>
              <span>Disponible: <b>${fmtDate(o.fechaDisponibleHeader)}</b></span>
            </span>
            <span class="stamp ${meta.color}">${meta.label}</span>
          </div>
        </div>
        <div class="lines-wrap">
          <table class="lines">
            <thead>
              <tr>
                <th>Artículo</th>
                <th class="num">Cantidad</th>
                <th class="num">Stock</th>
                <th class="num">Disponible</th>
                <th>Fecha disponibilidad</th>
              </tr>
            </thead>
            <tbody>${linesHtml}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');
}

function toggleOrder(headEl){
  headEl.parentElement.classList.toggle('open');
}

initMsal();
</script>
</body>
</html>
